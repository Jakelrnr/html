<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     
  <label for="name">Full Name</label>
  <input type="text" id="name" name="name">
  <label for="email">Email</label>
  <input type="email" id="email" name="email">
  <label for="tele">Telephone</label>
  <input type="text" id="tele" name="telephone">
  <label for="date">Date of Birth</label>
  <input type="date" id="date" name="date_of_birth">
  <label for="nhs">NHS number</label>
  <input type="text" id="nhs" name="nhs_number" pattern="[0-9]{10}" maxlength="10">
  <label for="password">Password</label>
  <input type="password" id="password" name="password"maxlength="10">
  <fieldset>
  <legend>What type of appointment?</legend>
 
  <input type="radio" id="gp"
         name="appt_type" value="gp">
  <label for="gp">GP appointment</label>
 
  <input type="radio" id="nurse"
         name="appt_type" value="nurse">
  <label for="nurse">Nurse clinic</label>
 
  <input type="radio" id="phone"
         name="appt_type" value="phone">
  <label for="phone">Telephone consultation</label>
  </fieldset>
<label for="physicians">Preferred Physician:</label>
<select  name="physician" id="physicians">
  <optgroup label="Doctors">
    <option value="steve">Steve</option>
    <option value="john">John</option>
    <option value="mc lovin">Mc Lovin</option>


<form method="post">
<fieldset>
  </optgroup>
    <legend>Symptoms</legend>
    <label><input type="checkbox" name="symptoms[]" value="fever"> Fever</label>
    <label><input type="checkbox" name="symptoms[]" value="cough"> Cough</label>
    <label><input type="checkbox" name="symptoms[]" value="fatigue"> Fatigue</label>
 </fieldset>

<label for="name">Full Name</label>
  <input type="textarea" rows="4" id="name" name="name">  

<fieldset>
  </optgroup>
    <legend>Consent to be contacted?</legend>
    <label><input type="checkbox" name="consent" value="yes"> Yes</label>


</fieldset>
 <input type="hidden" id="web" name="web" value="web">

<button type="reset">Reset</button>

<button type="submit">Book</button>
</form>

    
</body>
</html>
