<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Northfield Surgery</title>
</head>
<body>
    <h1>Book an Appointment</h1>
    <p>Use the form below to book an appointment with one of our clinicians at Northfield Surgery.</p>
    <h2>Appointment Booking Form</h2>
    <h3> Your Details</h3>
<label for="name">Full Name</label>
  <input type="text" id="name" name="name">
  <label for="email">Email</label>
  <input type="email" id="email" name="email">
  <label for="tele">Telephone</label>
  <input type="text" id="tele" name="telephone">
  <label for="date">Date of Birth</label>
  <input type="date" id="date" name="date_of_birth">
  <label for="nhs">NHS number</label>
  <input type="text" id="nhs" name="nhs_number" pattern="[0-9]{10}" maxlength="10">
  <fieldset>
  <legend>What type of appointment?</legend>
 
  <input type="radio" id="gp"
         name="appt_type" value="gp">
  <label for="gp">GP appointment</label>
 
  <input type="radio" id="nurse"
         name="appt_type" value="nurse">
  <label for="nurse">Nurse clinic</label>
 
  <input type="radio" id="phone"
         name="appt_type" value="phone">
  <label for="phone">Telephone consultation</label>
  </fieldset>
  <label for="physicians">Preferred Physician:</label>
<select  name="physician" id="physicians">
  <optgroup label="Doctors">
    <option value="steve">Steve</option>
    <option value="john">John</option>
    <option value="mc lovin">Mc Lovin</option>
<form method="post">

<label for="prefdate">Preferred Date</label>
  <input type="date" id="prefdate" name="preferred_date" min = date.today() max = date.today() + timedelta(days=30) required>
<fieldset>
  <legend>Preffered Time</legend>
 
  <input type="radio" id="timeslot1"
         name="timeslot" value="timeslot1">
  <label for="timeslot1">09:00</label>
  <input type="radio" id="timeslot1"
         name="timeslot" value="timeslot1">
  <label for="timeslot1">11:30</label>
  <input type="radio" id="timeslot1"
         name="timeslot" value="timeslot1">
  <label for="timeslot1">14:00</label>
  <input type="radio" id="timeslot1"
         name="timeslot" value="timeslot1">
  <label for="timeslot1">16:30</label>
 
  
  </fieldset>

  <label for="aptmt_reason">Reason for appointment</label>
  <input type="textarea" rows="4" id="aptmt_reason" name="aptmt_reason"maxlength="500" required>
  
 
  </optgroup>
    <legend>Confirm details</legend>
    <label><input type="checkbox" name="Detail Confirm" value="yes" required> Yes</label>

   
  </optgroup>
    <legend>Consent to be contacted?</legend>
    <label><input type="checkbox" name="consent" value="yes"> Yes</label>
   

  </optgroup>
    <legend>Interpreter required?</legend>
    <label><input type="checkbox" name="interpreter" value="yes"> Yes</label>


  </fieldset>

    
    
</body>
</html>
